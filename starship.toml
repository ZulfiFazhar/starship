#format = """
#[╭─user───❯](bold blue) $username
#[┣─system─❯](bold yellow) $hostname
#[┣─project❯](bold red) $directory$rust$git_branch$git_status$package$golang$terraform$docker_context$python$docker_context$nodejs
#[╰─cmd────❯](bold green) 
#"""

[username]
style_user = "green bold"
style_root = "red bold"
format = "[⚡$user]($style) "
disabled = false
show_always = true

[os.symbols]
Windows = '⚡ ' 
Arch = '󰣇'
Ubuntu = ''
Macos = '󰀵'

[hostname]
ssh_only = false
format = 'on [$hostname](bold yellow) '
trim_at = "."
disabled = false

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[❯](bold green)"     # The "success_symbol" segment is being set to "➜" with the color "bold green"
error_symbol = "[✗](bold red)"

#  
# configure directory

[directory]
read_only = '  '
truncation_length = 10
truncate_to_repo = true # truncates directory to root folder if in github repo
style = "bold italic blue"
format = 'at [$path]($style)[$read_only]($read_only_style) '
truncation_symbol = '…/'
home_symbol = '󰋜 ~'
read_only_style = '197'

[aws]
symbol = "☁️ "

[conda]
symbol = " "
style = "yellow"
format = "\n[󱞪](bold green) env [$symbol$environment]($style) "

[dart]
symbol = "🎯 "

#[directory]
#read_only = " "

[docker_context]
symbol = "🐳 "
format = "\n[󱞪](bold green) via [$symbol$context]($style) "
style = "blue bold"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []
disabled = false

[elixir]
symbol = "💧 "

[elm]
symbol = "🌳 "

[git_branch]
symbol = ' '
format = "\n[󱞪](bold green) on [$symbol$branch(:$remote_branch)]($style) "
# truncation_length = 4
truncation_symbol = '…/'
style = 'bold green'

# Shows current git status
[git_status]
format = " (bold green)[$all_status$ahead_behind]($style) "
style = 'bold green'
conflicted = '🏳'
up_to_date = ''
untracked = ' '
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
stashed = ' '
modified = ' '
staged = '[++\($count\)](green)'
renamed = '襁 '
deleted = ' '

[git_commit]
commit_hash_length = 8
style = "bold white"
tag_symbol = ' '

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

# Shows kubernetes context and namespace
[kubernetes]
format = '\n[󱞪](bold green) via [󱃾 $context\($namespace\)](bold purple) '
disabled = false
symbol = "☸ "

[golang]
symbol = "🐹 "

[hg_branch]
symbol = " "

[java]
symbol = "☕ "

[julia]
symbol = " "

[memory_usage]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[package]
symbol = " "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = "🐍 "
pyenv_version_name = true
format = '(bold green) via [${symbol}python (${version} )(\($virtualenv\) )]($style) '
#style = "bold yellow"
pyenv_prefix = "venv "
python_binary = ["./venv/bin/python", "python", "python3", "python2"]
detect_extensions = ["py"]
version_format = "v${raw}"

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shlvl]
symbol = " "

[swift]
symbol = "ﯣ "

[nodejs]
symbol = " "
format = "(bold green) via [$symbol($version )]($style) "
style = "italic yellow"
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

